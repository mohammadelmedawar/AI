<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>
    pre { position: relative; padding-right: 56px !important; cursor: pointer; }
    pre, pre code { white-space: pre-wrap !important; }
    .copy-btn {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: #f6f8fa; border: 1px solid #d1d9e0; border-radius: 6px;
      color: #59636e; cursor: pointer;
    }
    .copy-btn:hover { background: #eef1f4; }
    .copy-btn.copied { color: #1a7f37; }
  </style>
</head>
<body>
  <div class="container-lg px-3 my-5 markdown-body">
    {{ content }}
  </div>
  <script>
    var copyIcon = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5.75" y="0.75" width="9.5" height="9.5" rx="1.5"/><path d="M3.5 5.25H2.25a1.5 1.5 0 0 0-1.5 1.5v7a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5V12.5"/></svg>';
    var checkIcon = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>';
    document.querySelectorAll('pre').forEach(function (pre) {
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.title = 'Copy';
      btn.innerHTML = copyIcon;
      pre.onclick = function () {
        if (window.getSelection().toString()) return;
        navigator.clipboard.writeText((pre.querySelector('code') || pre).innerText);
        btn.innerHTML = checkIcon;
        btn.classList.add('copied');
        setTimeout(function () { btn.innerHTML = copyIcon; btn.classList.remove('copied'); }, 2000);
      };
      pre.appendChild(btn);
    });
  </script>
</body>
</html>
